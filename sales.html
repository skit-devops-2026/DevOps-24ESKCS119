<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales - SmartShop</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>SmartShop</h2>

        <p class="admin">Shop Management</p>

        <a href="index.html" class="menu">Dashboard</a>
        <a href="products.html" class="menu">Products</a>
        <a href="sales.html" class="menu active">Sales</a>
        <a href="customers.html" class="menu">Customers</a>
        <a href="inventory.html" class="menu">Inventory</a>

    </aside>


    <!-- Main Content -->
    <main class="main">

        <!-- Header -->
        <header class="header">

            <div>
                <h1>Sales</h1>
                <p>Manage shop sales</p>
            </div>

            <button class="logout">Logout</button>

        </header>


        <!-- Add Sale -->
        <section class="table-section">

            <div class="section-title">
                <h2>Add Sale</h2>
            </div>

            <form id="salesForm">

                <input type="text" placeholder="Customer Name" id="customerName">

                <input type="text" placeholder="Product Name"  id="saleProduct">

                <input type="number" placeholder="Quantity" id="saleQuantity">

                <input type="number" placeholder="Amount" id="saleAmount">

                <input type="date" id="saleDate">

                <button type="submit" class="view-btn">
                    Add Sale
                </button>

            </form>

        </section>


        <!-- Sales List -->
        <section class="table-section" style="margin-top: 25px;">

            <div class="section-title">
                <h2>Sales Records</h2>
            </div>

            <table>

                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Amount</th>
                        <th>Date</th>
                    </tr>
                </thead>

                <tbody  id="salesTable">

                   

                </tbody>

            </table>

        </section>

    </main>
        <script src="js/sales.js"></script>
</body>

</html>
